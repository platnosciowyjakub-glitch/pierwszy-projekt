<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testujemy czy to działa</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #22c55e; --button: #ec4899;
      --line: #334155; --danger: #f87171;
      font: 100%/1.5 system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      grid-template-columns: minmax(0, 30rem); justify-content: center;
      background: var(--bg); color: var(--text); padding: 1rem;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      background: var(--card); border-radius: 1rem; padding: 2rem;
      max-width: 30rem; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 .5rem; font-size: 2.25rem; line-height: 1.1; letter-spacing: -0.02em; font-weight: 750; }
    h2 { margin: 0 0 .75rem; font-size: 1.25rem; line-height: 1.25; letter-spacing: -0.01em; }
    .ok { color: var(--accent); font-size: 3rem; line-height: 1.2; }
    button {
      background: var(--button); color: #0f172a; border: 0; border-radius: .5rem;
      padding: .75rem 1.25rem; font: inherit; font-weight: 600; cursor: pointer;
      touch-action: manipulation;
      transition: transform 100ms ease-out, filter 100ms ease-out;
    }
    /* Reakcja od razu przy wciśnięciu, nie dopiero po puszczeniu */
    button:active { transform: scale(0.96); filter: brightness(0.9); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--button); outline-offset: 2px; }
    #count { font-size: 2rem; line-height: 1.2; margin: 1rem 0; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    small { opacity: .6; font-size: .8125rem; letter-spacing: .01em; }
    .badge { display: inline-block; background: var(--line); border-radius: 999px; padding: .125rem .625rem; font-size: .75rem; letter-spacing: .02em; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0; }
    form { display: flex; gap: .5rem; }
    input {
      flex: 1; min-width: 0; padding: .625rem .75rem; border-radius: .5rem;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
    }
    ul { list-style: none; padding: 0; margin: 1rem 0 0; text-align: left; }
    /* Wiersz zadania: pod spodem czerwone tło "usuń", na wierzchu przesuwana karta */
    li {
      position: relative; border-radius: .5rem; margin-bottom: .375rem;
      background: #7f1d1d; overflow: hidden;
    }
    li::after {
      content: 'Usuń'; position: absolute; right: .875rem; top: 50%; transform: translateY(-50%);
      color: #fecaca; font-size: .8125rem; font-weight: 600; letter-spacing: .02em;
    }
    .row {
      position: relative; z-index: 1; display: flex; align-items: center; gap: .625rem;
      padding: .5rem .625rem; background: var(--bg); border-radius: .5rem;
      touch-action: pan-y; user-select: none; will-change: transform;
    }
    .row span { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
    li.done .row span { text-decoration: line-through; opacity: .5; }
    .row button { background: transparent; color: var(--danger); padding: .25rem .5rem; font-size: 1.125rem; line-height: 1; }
    #quote { font-style: italic; min-height: 3rem; }

    @media (prefers-contrast: more) {
      .card { border: 2px solid var(--text); box-shadow: none; }
      input, .row { border: 1px solid var(--text); }
      small, li.done .row span { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: filter 100ms ease-out; }
      button:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="ok">✅</div>
    <h1>Działa!</h1>
    <p>Jeśli to widzisz, repo na GitHubie i deploy na Vercelu działają poprawnie.</p>
    <div id="count">0</div>
    <button id="btn">Kliknij mnie</button>
    <p><small id="time"></small></p>
    <span class="badge">wersja 3</span>

    <hr>
    <h2>📝 Lista zadań</h2>
    <form id="todo-form">
      <input id="todo-input" placeholder="Co masz do zrobienia?" autocomplete="off">
      <button type="submit">Dodaj</button>
    </form>
    <ul id="todo-list"></ul>
    <small id="todo-info"></small>

    <hr>
    <h2>💡 Losowy cytat</h2>
    <p id="quote"></p>
    <button id="quote-btn">Losuj</button>
  </main>
  <script>
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    let n = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('count').textContent = ++n;
    });
    document.getElementById('time').textContent =
      'Strona załadowana: ' + new Date().toLocaleString('pl-PL');

    // Sprężyna: "damping" = ile odbicia (1 = bez odbicia), "response" = jak szybko dojeżdża (w sekundach).
    // Zawsze rusza z miejsca, w którym element jest teraz, i z prędkością, jaką ma teraz,
    // więc można ją w każdej chwili złapać palcem i zawrócić.
    function spring({ from, to, velocity = 0, damping = 1, response = 0.35, onUpdate, onDone }) {
      const k = (2 * Math.PI / response) ** 2;
      const c = 4 * Math.PI * damping / response;
      let x = from, v = velocity, last = performance.now(), id;
      const step = now => {
        let dt = Math.min((now - last) / 1000, 1 / 30);
        last = now;
        for (let i = 0; i < 4; i++) {
          v += (-k * (x - to) - c * v) * dt / 4;
          x += v * dt / 4;
        }
        if (Math.abs(x - to) < 0.5 && Math.abs(v) < 10) {
          onUpdate(to);
          onDone && onDone();
          return;
        }
        onUpdate(x);
        id = requestAnimationFrame(step);
      };
      id = requestAnimationFrame(step);
      return { stop: () => cancelAnimationFrame(id), get value() { return x; }, get velocity() { return v; } };
    }

    // Gdzie element by się zatrzymał, gdyby jechał dalej siłą rozpędu (jak przewijanie w iPhonie)
    const project = (velocity, rate = 0.99) => (velocity / 1000) * rate / (1 - rate);

    // Opór przy krawędzi: im dalej ciągniesz, tym mniej element się rusza
    const rubberband = (over, dim, c = 0.55) => (over * dim * c) / (dim + c * Math.abs(over));

    // Lista zadań zapisywana w przeglądarce (localStorage)
    const KEY = 'todos';
    let todos = [];
    try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} };
    const list = document.getElementById('todo-list');

    // Usuwanie: karta zawsze wyjeżdża w lewo (tak jak przy przesunięciu palcem), potem wiersz się zwija
    function removeTodo(t, li, row, fromX = 0, velocity = 0) {
      if (li.dataset.removing) return;
      li.dataset.removing = '1';
      const finish = () => {
        todos.splice(todos.indexOf(t), 1);
        save();
        const collapse = li.animate(
          [{ height: li.offsetHeight + 'px', marginBottom: '6px' }, { height: '0px', marginBottom: '0px' }],
          { duration: reduceMotion.matches ? 0 : 200, easing: 'ease-out' });
        collapse.onfinish = () => render();
      };
      if (reduceMotion.matches) {
        row.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150 }).onfinish = () => {
          row.style.opacity = 0; finish();
        };
        return;
      }
      spring({
        from: fromX, to: -li.offsetWidth, velocity: Math.min(velocity, -800), damping: 1, response: 0.3,
        onUpdate: x => row.style.transform = `translateX(${x}px)`, onDone: finish,
      });
    }

    // Przesuwanie zadania palcem/myszą w lewo, żeby je usunąć
    function makeSwipeable(t, li, row) {
      let x = 0, anim = null, start = null, dragging = false, history = [];
      const set = v => { x = v; row.style.transform = `translateX(${v}px)`; };

      row.addEventListener('pointerdown', e => {
        if (e.button !== 0 || e.target.closest('button') || li.dataset.removing) return;
        if (anim) { anim.stop(); anim = null; } // złapanie w locie: startujemy z aktualnej pozycji
        start = { px: e.clientX, py: e.clientY, x, id: e.pointerId };
        dragging = false;
        history = [{ x, t: e.timeStamp }];
      });

      row.addEventListener('pointermove', e => {
        if (!start || e.pointerId !== start.id) return;
        const dx = e.clientX - start.px, dy = e.clientY - start.py;
        if (!dragging) {
          if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { start = null; return; } // to przewijanie, nie przesuwanie
          if (Math.abs(dx) < 10) return;
          dragging = true;
          row.setPointerCapture(e.pointerId);
          start.px += Math.sign(dx) * 10; // bez skoku o próg 10px
        }
        let next = start.x + (e.clientX - start.px);
        if (next > 0) next = rubberband(next, li.offsetWidth); // w prawo nic nie ma, więc tylko lekki opór
        set(next);
        history.push({ x: next, t: e.timeStamp });
        if (history.length > 5) history.shift();
      });

      const end = e => {
        if (!start || e.pointerId !== start.id) return;
        start = null;
        if (!dragging) return;
        const a = history[0], b = history[history.length - 1];
        const velocity = b.t > a.t ? (b.x - a.x) / (b.t - a.t) * 1000 : 0; // px na sekundę
        const landing = x + project(velocity);
        if (landing < -li.offsetWidth / 2) {
          removeTodo(t, li, row, x, velocity);
        } else {
          anim = spring({
            from: x, to: 0, velocity,
            damping: Math.abs(velocity) > 300 ? 0.8 : 1, // lekkie odbicie tylko po energicznym ruchu
            response: 0.3, onUpdate: set, onDone: () => anim = null,
          });
        }
        // Po przesunięciu nie traktujemy puszczenia jako kliknięcia w zadanie
        li.dataset.dragged = '1';
        setTimeout(() => delete li.dataset.dragged);
      };
      row.addEventListener('pointerup', end);
      row.addEventListener('pointercancel', end);
    }

    function render(added) {
      list.innerHTML = '';
      todos.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';
        const row = document.createElement('div');
        row.className = 'row';
        const span = document.createElement('span');
        span.textContent = t.text;
        span.onclick = () => {
          if (li.dataset.dragged) return;
          t.done = !t.done; save(); li.classList.toggle('done', t.done); updateInfo(); };
        const del = document.createElement('button');
        del.textContent = '✕';
        del.title = 'Usuń';
        del.setAttribute('aria-label', 'Usuń zadanie: ' + t.text);
        del.onclick = () => removeTodo(t, li, row);
        row.append(span, del);
        li.append(row);
        list.append(li);
        makeSwipeable(t, li, row);
        // Nowe zadanie "wysuwa się" spod pola, w które je wpisano
        if (t === added) {
          li.animate(reduceMotion.matches
            ? [{ opacity: 0 }, { opacity: 1 }]
            : [{ opacity: 0, transform: 'translateY(-8px) scale(0.98)' }, { opacity: 1, transform: 'none' }],
            { duration: 220, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
        }
      });
      updateInfo();
    }

    function updateInfo() {
      const left = todos.filter(t => !t.done).length;
      document.getElementById('todo-info').textContent = todos.length
        ? `Do zrobienia: ${left} z ${todos.length} · przesuń zadanie w lewo, żeby je usunąć`
        : 'Brak zadań. Dodaj coś!';
    }

    document.getElementById('todo-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      const t = { text, done: false };
      todos.push(t);
      input.value = '';
      save(); render(t);
    });
    render();

    // Losowe cytaty
    const quotes = [
      'Najlepszy moment na start był wczoraj. Drugi najlepszy jest teraz.',
      'Kod, który działa, jest lepszy niż idealny kod, który nie istnieje.',
      'Małe kroki każdego dnia dają wielkie wyniki.',
      'Nie bój się błędów, one uczą najwięcej.',
      'Najpierw zrób, żeby działało. Potem zrób, żeby było ładne.',
      'Każdy ekspert był kiedyś początkującym.',
    ];
    const quoteEl = document.getElementById('quote');
    let last = -1;
    function newQuote() {
      let i;
      do { i = Math.floor(Math.random() * quotes.length); } while (i === last);
      last = i;
      quoteEl.textContent = '„' + quotes[i] + '”';
      quoteEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
    }
    document.getElementById('quote-btn').addEventListener('click', newQuote);
    newQuote();
  </script>
</body>
</html>
